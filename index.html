<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <title>Simulador de turnos médicos</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Manrope:wght@200..800&family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./css/styles.css">
    <!-- JS -->
  <script defer src="./js/main.js"></script>
  <script defer src="./js/turnos.js"></script>

    
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  
  <body class="container">

     <h1 class="text-center mb-4">Administrador de turnos médicos</h1>
<div class="todo">

  <div class="container-agendar">
  <h2 class="text-center mt-2 mb-4">Agendar un turno</h2>
  <form id="formTurno" class="mb-4">
    <div class="mb-2">
      <label>Especialidad</label>
      <select id="especialidad" class="form-select" required><option value="" disabled selected>Seleccione una especialidad</option>
      </select>
    </div>

    <div class="mb-2">
    <label>Profesional</label>
      <select id="medico" class="form-select" required><option value="" disabled selected>Seleccione un medico</option>></select>
    </div>

    <div class="mb-2">
    <label>Fecha</label>
      <select id="fecha" class="form-select" required><option value="" disabled selected>Seleccione una fecha</option>></select>
    </div>

    <div class="mb-2">
      <label>Horario</label>
      <select id="horario" class="form-select" required><option value="" disabled selected>Seleccione un horario</option>></select>
    </div>

  <h3 class="text-center mt-3 fs-4">Datos del paciente</h3>

    <div class="mb-2">
      <input type="text" id="dni" placeholder="DNI" class="form-control" required inputmode="numeric" pattern="\d{7,8}" title="Ingrese DNI de 7 u 8 números">
    </div>

    <div class="mb-2">
      <input type="text" id="nombre" placeholder="Nombre" class="form-control" required pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$" title="Solo se permiten letras">
    </div>

    <div class="mb-2">
      <input type="text" id="apellido" placeholder="Apellido" class="form-control" required pattern="^[A-Za-zÁÉÍÓÚáéíóúÑñ\s]+$" title="Solo se permiten letras">
    </div>

    <div class="mb-2">
      <input type="date" id="fechaNacimiento" placeholder="Fecha de Nacimeinto" class="form-control" required>
    </div>

    <div class="mb-2">
      <input type="email" id="email" placeholder="E-mail" class="form-control" required>
    </div>

    <div class="mb-2">
      <input type="tel" id="telefono" placeholder="Telefono: Cod. Área + Número (sin 0 ni 15)" class="form-control" required pattern="[0-9]{10,13}" 
  title="Ingresa entre 10 y 13 números">
    </div>


    <button class="btn btn-primary">Agendar turno</button>
  </form>
</div>

<div class="container-turnos-agendados">

  <h2 class="text-center mt-2 mb-4">Turnos agendados</h2>

  <!-- FILTROS -->
  <div class="row mb-3">

    <div class="col-md-4">
      <label>Fecha</label>
      <input type="date" id="filtroFecha" class="form-control">
    </div>

    <div class="col-md-4">
      <label>Médico</label>
      <select id="filtroMedico" class="form-select">
        <option value="todos">Todos</option>
      </select>
    </div>

    <div class="col-md-4">
      <label>Buscar por DNI</label>
      <input type="text" id="buscarDni" class="form-control" placeholder="Ingrese DNI">
    </div>

  </div>
    <ul id="listaTurnos" class="list-group"></ul>
</div>

  </div>

</div>
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
